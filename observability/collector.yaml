receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 32
    spike_limit_mib: 8
exporters:
  awsxray:
    region: ${env:AWS_REGION}
    sending_queue:
      enabled: true
      queue_size: 128
    retry_on_failure:
      enabled: true
      max_elapsed_time: 10s
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [awsxray]
