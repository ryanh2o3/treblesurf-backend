name: Deploy to AWS Lambda

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: "1.24"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::759663378274:role/github_actions_oidc
          aws-region: eu-west-1
          audience: sts.amazonaws.com

      - name: Build the Go application
        run: |
          # Build each function with distinct names from the start
          GOOS=linux GOARCH=amd64 go build -o api-bootstrap main.go
          GOOS=linux GOARCH=amd64 go build -o websocket-bootstrap ./websocket/main.go

      - name: Package the application
        run: |
          # Package API Lambda
          cp api-bootstrap bootstrap
          zip bootstrap.zip bootstrap
          rm bootstrap

          # Package WebSocket Lambda
          cp websocket-bootstrap bootstrap
          zip websocket-bootstrap.zip bootstrap
          rm bootstrap

      - name: Deploy Lambdas and Setup API Gateway
        run: |
          FUNCTION_NAME="api"
          API_ID="bg4yv0rzhe"
          REGION="eu-west-1"
          ZIP_FILE="bootstrap.zip"
          ROLE_ARN="arn:aws:iam::759663378274:role/service-role/api-role-pydrwpue"


          # Deploy Lambda function
          aws lambda update-function-code --function-name $FUNCTION_NAME --zip-file fileb://$ZIP_FILE

          # Wait for the function update to complete before proceeding
          aws lambda wait function-updated --function-name $FUNCTION_NAME

          # Update Lambda environment variables
          aws lambda update-function-configuration \
            --function-name $FUNCTION_NAME \
            --environment "Variables={JWT_SECRET='$JWT_SECRET',WEBSOCKET_API_ENDPOINT='9q47dtf5qe.execute-api.eu-west-1.amazonaws.com'}"

      - name: Deploy WebSocket Lambda
        run: |
          WS_FUNCTION_NAME="websockets"
          WS_ZIP_FILE="websocket-bootstrap.zip"
          REGION="eu-west-1"

          # Update existing WebSocket Lambda
          aws lambda update-function-code --function-name $WS_FUNCTION_NAME --zip-file fileb://$WS_ZIP_FILE

          # Wait for the function update to complete
          aws lambda wait function-updated --function-name $WS_FUNCTION_NAME


          # Update WebSocket Lambda environment variables
          aws lambda update-function-configuration \
            --function-name $WS_FUNCTION_NAME \
            --environment "Variables={JWT_SECRET='$JWT_SECRET',WEBSOCKET_API_ENDPOINT='9q47dtf5qe.execute-api.eu-west-1.amazonaws.com'}"

          # Configure permissions for WebSocket API Gateway
          WEBSOCKET_API_ID="9q47dtf5qe"

          # Add permission for WebSocket API Gateway to invoke the Lambda (if not already added)
          aws lambda add-permission \
            --function-name $WS_FUNCTION_NAME \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "arn:aws:execute-api:$REGION:759663378274:$WEBSOCKET_API_ID/*" \
            --statement-id AllowWebSocketInvoke-$WEBSOCKET_API_ID \
            || echo "Permission already exists or couldn't be added"
